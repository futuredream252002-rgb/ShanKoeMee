<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ဗီဒီယို မြန်မာစာတန်းထိုး စတူဒီယို (Auto Model Rotation)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Myanmar', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .loader { border-top-color: #38bdf8; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Circular progress */
        .circle-progress {
            --size: 80px;
            --stroke-width: 8px;
            --progress: 0;
            position: relative;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: conic-gradient(#38bdf8 calc(var(--progress) * 1%), #1e293b 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .circle-progress::before {
            content: '';
            position: absolute;
            inset: var(--stroke-width);
            background-color: #0f172a;
            border-radius: 50%;
        }
        .circle-progress span {
            position: relative;
            z-index: 1;
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
        }
        .circle-progress.done {
            background: #38bdf8;
        }
        .circle-progress.done::before {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <div class="flex items-center gap-3">
            <div class="bg-sky-600 p-2.5 rounded-xl">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white">AI ဗီဒီယို မြန်မာစာတန်းထိုး စတူဒီယို</h1>
                <p class="text-xs text-slate-400">Google Gemini API (Auto Model & Key Rotation)</p>
            </div>
        </div>
        <button onclick="toggleApiModal()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-slate-200 border border-slate-600">⚙️ API Keys စီမံရန်</button>
    </div>

    <div id="apiModal" class="hidden bg-slate-800 p-4 rounded-2xl border border-sky-500/50 space-y-3">
        <label class="block text-sm font-medium text-sky-300">Gemini API Keys စာရင်း (တစ်ကြောင်းလျှင် တစ်ခုစီ ထည့်ပါ)</label>
        <textarea id="apiKeyInput" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-sky-500"></textarea>
        <div class="flex justify-between items-center">
            <p id="keyCount" class="text-xs text-slate-400">သော့အရေအတွက်:</p>
            <button onclick="saveApiKeys()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-xl text-sm font-medium">သိမ်းမည်</button>
        </div>
    </div>

    <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 space-y-4">
        <div class="border-2 border-dashed border-slate-600 rounded-xl p-6 text-center hover:border-sky-500 transition cursor-pointer" onclick="document.getElementById('mediaInput').click()">
            <input type="file" id="mediaInput" accept="video/*,audio/*" class="hidden" onchange="handleFileSelect(event)">
            <svg class="w-10 h-10 text-sky-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p id="fileNameDisplay" class="text-sm font-medium text-slate-200">Video သို့မဟုတ် Audio ဖိုင်ကို ဤနေရာတွင် ရွေးချယ်ပါ</p>
            <p class="text-xs text-slate-400 mt-1">MP4, MKV, MOV, MP3, WAV ဖိုင်များ ရပါသည်</p>
        </div>
        <video id="videoPreview" controls class="hidden w-full rounded-xl max-h-64 bg-black"></video>

        <!-- Language mode buttons removed - always Myanmar only -->

        <button id="generateBtn" onclick="processMedia()" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
            <span>✨ AI ဖြင့် မြန်မာစာသား စတင်ထုတ်ယူမည် (Auto Model)</span>
        </button>
    </div>

    <div id="statusBox" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center space-y-3">
        <div id="spinner" class="loader ease-linear rounded-full border-4 border-t-4 border-slate-600 h-10 w-10 mx-auto"></div>
        <p id="statusTitle" class="text-base font-semibold text-sky-300">လုပ်ဆောင်နေပါသည်...</p>
        <p id="statusDesc" class="text-xs text-slate-400">အသံဖိုင်ကို ပြင်ဆင်နေပါသည်...</p>
    </div>

    <div id="resultSection" class="hidden bg-slate-800/80 p-6 rounded-2xl border border-slate-700 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 pb-4">
            <h2 class="text-base font-bold text-white">📄 ထွက်ရှိလာသော မြန်မာစာသားများ</h2>
            <div class="flex gap-2">
                <button onclick="copyTranscript()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg">📋 ကူးယူမည်</button>
                <button onclick="downloadFile('txt')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg">💾 TXT သိမ်းမည်</button>
                <button onclick="downloadFile('srt')" class="text-xs bg-sky-600 hover:bg-sky-500 px-3 py-2 rounded-lg font-medium">🎬 SRT စာတန်းထိုး သိမ်းမည်</button>
            </div>
        </div>
        <div id="transcriptList" class="space-y-3 max-h-[500px] overflow-y-auto pr-2"></div>
    </div>
</div>

<script>
    let selectedFile = null;
    let transcriptData = [];
    let availableModels = [];
    let progressInterval = null;

    const defaultKeys = ["AQ.Ab8RN6IYjlyKKAj_MhsLSuHNHN18XlA4upxjpvwVG91lQcTnjQ"];

    window.onload = () => {
        let savedKeys = JSON.parse(localStorage.getItem('gemini_keys_list'));
        if (!savedKeys || savedKeys.length === 0) {
            savedKeys = defaultKeys;
            localStorage.setItem('gemini_keys_list', JSON.stringify(savedKeys));
        }
        document.getElementById('apiKeyInput').value = savedKeys.join('\n');
        updateKeyCount(savedKeys.length);
    };

    function toggleApiModal() { document.getElementById('apiModal').classList.toggle('hidden'); }

    function saveApiKeys() {
        const text = document.getElementById('apiKeyInput').value;
        const keys = text.split('\n').map(k => k.trim()).filter(k => k.length > 0);
        localStorage.setItem('gemini_keys_list', JSON.stringify(keys));
        updateKeyCount(keys.length);
        alert('Gemini API Keys များ သိမ်းဆည်းပြီးပါပြီ။');
        toggleApiModal();
    }

    function updateKeyCount(count) { document.getElementById('keyCount').textContent = `သော့အရေအတွက်: ${count} ခု`; }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        selectedFile = file;
        document.getElementById('fileNameDisplay').textContent = `ရွေးချယ်ထားသောဖိုင်: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)`;
        const videoPreview = document.getElementById('videoPreview');
        if (file.type.startsWith('video/')) {
            videoPreview.src = URL.createObjectURL(file);
            videoPreview.classList.remove('hidden');
        } else { videoPreview.classList.add('hidden'); }
    }

    async function extractCompressedAudio(file) {
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedAudio = await audioCtx.decodeAudioData(arrayBuffer);
        const targetSampleRate = 16000;
        const offlineCtx = new OfflineAudioContext(1, decodedAudio.duration * targetSampleRate, targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = decodedAudio;
        source.connect(offlineCtx.destination);
        source.start();
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWav(renderedBuffer);
        return await blobToBase64(wavBlob);
    }

    function audioBufferToWav(buffer) {
        const numOfChan = 1;
        const length = buffer.length * numOfChan * 2 + 44;
        const out = new ArrayBuffer(length);
        const view = new DataView(out);
        const sampleRate = buffer.sampleRate;
        let pos = 0;
        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < channelData.length; i++) {
            let sample = Math.max(-1, Math.min(1, channelData[i]));
            sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            view.setInt16(pos, sample, true); pos += 2;
        }
        return new Blob([out], { type: 'audio/wav' });
    }

    function blobToBase64(blob) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(blob);
        });
    }

    async function fetchAvailableModels(apiKey) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            const data = await response.json();
            if (data.models) {
                return data.models
                    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                    .map(m => m.name.replace('models/', ''));
            }
            return [];
        } catch (e) {
            console.warn("Model list fetch failed:", e);
            return [];
        }
    }

    function pickBestModel(models) {
        const priority = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash", "gemini-pro-vision"];
        for (let p of priority) {
            if (models.includes(p)) return p;
        }
        return models.length > 0 ? models[0] : null;
    }

    async function fetchWithGeminiRotation(base64Audio, promptText) {
        let keys = JSON.parse(localStorage.getItem('gemini_keys_list')) || defaultKeys;
        if (keys.length === 0) throw new Error("Gemini API Key တစ်ခုမှ မရှိပါ။");

        let lastError = null;

        for (let i = 0; i < keys.length; i++) {
            let currentKey = keys[i];
            let models = await fetchAvailableModels(currentKey);
            let modelName = pickBestModel(models);

            if (!modelName) {
                lastError = new Error("ဤ Key အတွက် အသုံးပြုနိုင်သော Model မရှိပါ။");
                continue;
            }

            let endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${currentKey}`;

            try {
                console.log(`Trying Key index ${i + 1} with Model: ${modelName}`);
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "audio/wav", data: base64Audio } }
                            ]
                        }],
                        generationConfig: { temperature: 0.2 }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Gemini API Error");

                return data.candidates[0].content.parts[0].text;

            } catch (err) {
                console.warn(`Key #${i+1} with Model ${modelName} failed:`, err.message);
                lastError = err;
            }
        }

        throw new Error("Gemini API Keys အားလုံး အလုပ်မလုပ်ပါ။ (LastError: " + (lastError ? lastError.message : "Unknown") + ")");
    }

    // Progress circle functions
    function showProgressCircle() {
        const statusBox = document.getElementById('statusBox');
        const spinner = document.getElementById('spinner');
        // Replace spinner with circle progress
        spinner.outerHTML = `
            <div id="progressCircle" class="circle-progress mx-auto" style="--progress: 0;">
                <span id="progressPercent">0%</span>
            </div>
        `;
        statusBox.classList.remove('hidden');
    }

    function updateProgress(percent) {
        const circle = document.getElementById('progressCircle');
        const label = document.getElementById('progressPercent');
        if (circle && label) {
            circle.style.setProperty('--progress', percent);
            label.textContent = percent + '%';
            if (percent >= 100) {
                circle.classList.add('done');
            }
        }
    }

    function hideProgressCircle() {
        const progressCircle = document.getElementById('progressCircle');
        if (progressCircle) {
            progressCircle.outerHTML = `<div id="spinner" class="loader ease-linear rounded-full border-4 border-t-4 border-slate-600 h-10 w-10 mx-auto"></div>`;
        }
        document.getElementById('statusBox').classList.add('hidden');
    }

    // Process media with progress simulation for script generation
    async function processMedia() {
        if (!selectedFile) return alert('ကျေးဇူးပြု၍ ဖိုင်တစ်ခုခု အရင်ရွေးပါ။');

        const statusBox = document.getElementById('statusBox');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const resultSection = document.getElementById('resultSection');
        const generateBtn = document.getElementById('generateBtn');

        // Reset & show progress circle
        showProgressCircle();
        updateProgress(0);
        resultSection.classList.add('hidden');
        generateBtn.disabled = true;
        generateBtn.classList.add('opacity-50');

        // Clear any previous interval
        if (progressInterval) clearInterval(progressInterval);

        try {
            statusTitle.textContent = "၁။ အသံဖိုင်ကို ပြင်ဆင်နေပါသည်...";
            statusDesc.textContent = "ဖိုင်ဆိုဒ်သေးငယ်စေရန် အသံသီးသန့် ပြောင်းလဲနေပါသည်...";
            
            const base64Audio = await extractCompressedAudio(selectedFile);
            updateProgress(15);

            statusTitle.textContent = "၂။ Gemini AI ဖြင့် ဘာသာပြန်နေပါသည်...";
            statusDesc.textContent = "အသုံးပြုနိုင်သော Model ကို အလိုအလျောက် ရှာဖွေပြီး စာသားထုတ်ယူနေပါသည်...";

            // Start progress simulation from 15% to 90%
            let progress = 15;
            progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 5;
                    if (progress > 90) progress = 90;
                    updateProgress(Math.floor(progress));
                }
            }, 800);

            // --- Updated prompt: Include Thiha and Nilar, always Burmese only ---
            const prompt = `Listen to this audio carefully. Detect the spoken language(s) and transcribe everything accurately with timestamps. Translate every single spoken line into natural, fluent Burmese (Myanmar language). Always output ONLY the Burmese translation in the "myanmar" field. Do not include original text.

            Additionally, create a script for two narrators: "Thiha" (male) and "Nilar" (female). Assign each line to either Thiha or Nilar based on natural conversation flow (e.g., alternate speakers or split long monologues). Include the narrator name in the "speaker" field.

            Return ONLY a valid JSON array with no markdown formatting, using this exact structure:
            [{"start": "00:00:01,000", "end": "00:00:05,000", "displayTime": "00:01 - 00:05", "seconds": 1, "original": "ignored", "myanmar": "မြန်မာဘာသာပြန် စာသား", "speaker": "Thiha" or "Nilar"}]`;

            let rawText = await fetchWithGeminiRotation(base64Audio, prompt);
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            transcriptData = JSON.parse(rawText);

            // Stop progress simulation and set to 100
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            updateProgress(100);

            // Small delay so user sees 100%
            await new Promise(resolve => setTimeout(resolve, 400));

            renderTranscript();
            hideProgressCircle();
            resultSection.classList.remove('hidden');

        } catch (err) {
            console.error(err);
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            hideProgressCircle();
            alert("အမှားအယွင်း ဖြစ်ပေါ်ပါသည်: " + err.message);
        } finally {
            generateBtn.disabled = false;
            generateBtn.classList.remove('opacity-50');
        }
    }

    function renderTranscript() {
        const list = document.getElementById('transcriptList');
        list.innerHTML = '';
        transcriptData.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/80 hover:border-sky-500/50 transition";
            // Always show Myanmar only, plus speaker name if available
            const speaker = item.speaker ? `<span class="text-xs font-semibold text-amber-400 mr-2">${item.speaker}:</span>` : '';
            div.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <button onclick="seekVideo(${item.seconds})" class="text-xs font-mono text-sky-400 hover:underline bg-sky-950/50 px-2 py-0.5 rounded">▶ ${item.displayTime}</button>
                </div>
                <p class="text-sm text-white leading-relaxed">${speaker}${item.myanmar}</p>`;
            list.appendChild(div);
        });
    }

    function seekVideo(seconds) {
        const video = document.getElementById('videoPreview');
        if (!video.classList.contains('hidden')) { video.currentTime = seconds; video.play(); }
    }

    function copyTranscript() {
        // Always Myanmar only with speaker
        const text = transcriptData.map(item => {
            const speaker = item.speaker ? `${item.speaker}: ` : '';
            return `[${item.displayTime}] ${speaker}${item.myanmar}`;
        }).join('\n\n');
        navigator.clipboard.writeText(text);
        alert('ကူးယူပြီးပါပြီ။');
    }

    function downloadFile(type) {
        // Always Myanmar only with speaker
        let content = type === 'srt' 
            ? transcriptData.map((item, idx) => {
                const speaker = item.speaker ? `${item.speaker}: ` : '';
                return `${idx + 1}\n${item.start} --> ${item.end}\n${speaker}${item.myanmar}`;
            }).join('\n\n')
            : transcriptData.map(item => {
                const speaker = item.speaker ? `${item.speaker}: ` : '';
                return `[${item.displayTime}] ${speaker}${item.myanmar}`;
            }).join('\n\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `myanmar_transcript.${type}`; a.click();
    }
</script>
</body>
</html>
